<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WonderQuest Kids Alpha</title>
<style>
:root{--purple:#7c5cff;--yellow:#ffd84d;--blue:#5ec8ff;--pink:#ff7a8a;--green:#62d26f;--navy:#24304f;--cream:#fffbf2}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,var(--blue),#e8fbff);font-family:Arial,Helvetica,sans-serif;color:var(--navy)}main{max-width:960px;margin:0 auto;min-height:100vh;padding:22px}.screen{background:var(--cream);border-radius:30px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.18);min-height:680px}.hero{width:120px;height:120px;border-radius:50%;margin:10px auto;background:linear-gradient(135deg,var(--purple),var(--pink));display:flex;align-items:center;justify-content:center;font-size:64px}h1{text-align:center;font-size:clamp(38px,7vw,72px);margin:12px 0}h2{font-size:32px;margin:14px 0}p{font-size:20px;line-height:1.4}.center{text-align:center}.card{background:white;border-radius:24px;padding:20px;margin:16px 0;box-shadow:0 10px 28px rgba(36,48,79,.14)}.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}.btn{border:0;border-radius:999px;padding:17px 24px;font-size:20px;font-weight:800;background:var(--purple);color:white;cursor:pointer;box-shadow:0 7px 0 rgba(36,48,79,.22)}.btn:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(36,48,79,.22)}.yellow{background:var(--yellow);color:var(--navy)}.pink{background:var(--pink)}.green{background:var(--green);color:var(--navy)}.blue{background:var(--blue);color:var(--navy)}.small{font-size:15px;padding:10px 14px}.badge{background:var(--yellow);border-radius:999px;padding:10px 16px;font-weight:800;display:inline-block;margin:4px}.bubble{width:116px;height:116px;border-radius:50%;border:0;background:radial-gradient(circle at 30% 25%,white,var(--blue) 35%,var(--purple));font-size:42px;color:white;font-weight:900}.letter{width:96px;height:96px;border-radius:22px;border:4px solid var(--navy);background:var(--yellow);font-size:42px;font-weight:900;color:var(--navy)}.word{display:inline-block;border:5px solid var(--purple);background:white;border-radius:24px;padding:18px 28px;font-size:54px;letter-spacing:9px;font-weight:900}.bar{height:20px;background:#e7e7ef;border-radius:999px;overflow:hidden}.bar div{height:100%;background:var(--green)}.tile{border:0;border-radius:28px;padding:24px;min-height:145px;font-size:23px;font-weight:900;color:white}.tile span{display:block;font-size:50px}.cert{border:8px double var(--purple);background:linear-gradient(135deg,#fff,#fff6bf);text-align:center}.hide{display:none}@media(max-width:600px){main{padding:0}.screen{border-radius:0;min-height:100vh}.bubble,.letter{width:86px;height:86px;font-size:34px}}
</style>
</head>
<body>
<main><section class="screen"><div id="app">
<div class="hero">🦊</div>
<h1>WonderQuest Kids</h1>
<p class="center">Where little minds go on big adventures.</p>
<div class="card"><p><b>Nova says:</b> Welcome, explorer! Choose a learning adventure below.</p></div>
<div class="row">
<button class="btn" onclick="showMap()">▶ Play</button>
<button class="btn yellow" onclick="showBadges()">🏆 Badges</button>
<button class="btn green" onclick="showParent()">🔒 Parent</button>
</div>
<div class="card center"><p>If you can see this screen, the app is live.</p></div>
</div></section></main>
<script>
(function(){
var state={stars:0,coins:0,math:0,reading:0,done:[],certs:[]};
try{var saved=localStorage.getItem('wonderquest_alpha');if(saved){state=JSON.parse(saved)}}catch(e){}
var score=0,round=1,total=5,problem={},letter={};
var words=['CAT','DOG','SUN','HAT','BUG','MAP','FOX','BED','PEN','CUP'];
function save(){try{localStorage.setItem('wonderquest_alpha',JSON.stringify(state))}catch(e){}}
function el(){return document.getElementById('app')}
function badges(){return '<span class="badge">⭐ '+state.stars+' Stars</span><span class="badge">🪙 '+state.coins+' Coins</span>'}
function top(title){return '<div class="row" style="justify-content:space-between"><button class="btn small blue" onclick="home()">Home</button><b>'+title+'</b><div>'+badges()+'</div></div>'}
function render(html){el().innerHTML=html}
window.home=function(){render('<div class="hero">🦊</div><h1>WonderQuest Kids</h1><p class="center">Where little minds go on big adventures.</p><div class="card"><p><b>Nova says:</b> Welcome back, explorer! Ready to learn?</p></div><div class="row"><button class="btn" onclick="showMap()">▶ Play</button><button class="btn yellow" onclick="showBadges()">🏆 Badges</button><button class="btn green" onclick="showParent()">🔒 Parent</button></div><div class="card center">'+badges()+'</div>')};
window.showMap=function(){render(top('World Map')+'<h2>Choose a Learning World</h2><div class="grid"><button class="tile" style="background:var(--green)" onclick="startMath()"><span>🔢</span>Number Valley</button><button class="tile" style="background:var(--blue)" onclick="startLetters()"><span>🔤</span>Letter Lagoon</button><button class="tile" style="background:var(--purple)" onclick="alert(\'Shape Castle is coming next.\')"><span>△</span>Shape Castle</button></div>')};
window.startMath=function(){score=0;round=1;nextMath()};
function nextMath(){var max=5+Math.floor(state.math/20);var a=1+Math.floor(Math.random()*max);var b=1+Math.floor(Math.random()*max);var ans=a+b;var choices=[ans];while(choices.length<3){var w=ans+Math.floor(Math.random()*7)-3;if(w>0&&choices.indexOf(w)<0){choices.push(w)}}choices.sort(function(){return Math.random()-.5});problem={a:a,b:b,ans:ans,choices:choices};showMath('Pop the bubble with the correct answer!')}
function showMath(msg){var html=top('Bubble Pop Addition')+'<div class="card"><p><b>Nova:</b> '+msg+'</p></div><h1>'+problem.a+' + '+problem.b+' = ?</h1><p class="center">Round '+round+'/'+total+' • Score '+score+'</p><div class="row">';for(var i=0;i<problem.choices.length;i++){html+='<button class="bubble" onclick="answerMath('+problem.choices[i]+')">'+problem.choices[i]+'</button>'}html+='</div>';render(html)}
window.answerMath=function(x){if(x===problem.ans){score++;if(round>=total){complete('Bubble Pop Addition','math');return}round++;showMath('Fantastic! You got it.');setTimeout(nextMath,600)}else{showMath('Good try. Count again and choose another bubble.')}};
window.startLetters=function(){score=0;round=1;nextLetter()};
function nextLetter(){var word=words[Math.floor(Math.random()*words.length)];var idx=Math.floor(Math.random()*word.length);var target=word.charAt(idx);var choices=[target];while(choices.length<4){var c=String.fromCharCode(65+Math.floor(Math.random()*26));if(choices.indexOf(c)<0){choices.push(c)}}choices.sort(function(){return Math.random()-.5});letter={word:word,idx:idx,target:target,choices:choices};showLetter('Find the missing treasure letter!')}
function showLetter(msg){var hidden=letter.word.substring(0,letter.idx)+'_'+letter.word.substring(letter.idx+1);var html=top('Letter Treasure Hunt')+'<div class="card"><p><b>Captain Splash:</b> '+msg+'</p></div><div class="center"><div class="word">'+hidden+'</div><p>Word: '+letter.word+'</p><p>Round '+round+'/'+total+' • Score '+score+'</p></div><div class="row">';for(var i=0;i<letter.choices.length;i++){html+='<button class="letter" onclick="answerLetter(\''+letter.choices[i]+'\')">'+letter.choices[i]+'</button>'}html+='</div>';render(html)}
window.answerLetter=function(x){if(x===letter.target){score++;if(round>=total){complete('Letter Treasure Hunt','reading');return}round++;showLetter('Amazing! You found it.');setTimeout(nextLetter,600)}else{showLetter('Good try. Look at the word and try again.')}};
function complete(title,type){state.stars+=5;state.coins+=20;if(type==='math'){state.math=Math.min(100,state.math+15);if(state.done.indexOf('math')<0){state.done.push('math')}}else{state.reading=Math.min(100,state.reading+15);if(state.done.indexOf('reading')<0){state.done.push('reading')}}if(score>=4){state.certs.push(title+' - '+new Date().toLocaleDateString())}save();render(top('Complete')+'<div class="center"><div class="hero">🏆</div><h1>Great Work!</h1><h2>'+title+'</h2><div class="card"><p><b>Score:</b> '+score+'/'+total+'</p><p>You earned 5 stars and 20 coins.</p></div><div class="row"><button class="btn" onclick="showMap()">Map</button><button class="btn pink" onclick="home()">Home</button></div></div>')}
window.showBadges=function(){var html=top('Badges')+'<div class="grid"><div class="card center"><div style="font-size:54px">'+(state.done.indexOf('math')>=0?'➕':'🔒')+'</div><h2>Addition Champion</h2></div><div class="card center"><div style="font-size:54px">'+(state.done.indexOf('reading')>=0?'🔤':'🔒')+'</div><h2>Letter Explorer</h2></div><div class="card center"><div style="font-size:54px">'+(state.stars>=25?'⭐':'🔒')+'</div><h2>Star Collector</h2></div></div><h2>Certificates</h2>';if(state.certs.length===0){html+='<div class="card"><p>No certificates yet. Score 4 or better to earn one.</p></div>'}else{for(var i=0;i<state.certs.length;i++){html+='<div class="card cert"><h2>Certificate of Achievement</h2><p>'+state.certs[i]+'</p></div>'}}render(html)};
window.showParent=function(){render(top('Parent Dashboard')+'<div class="card"><h2>Progress</h2><p>Stars: '+state.stars+'</p><p>Coins: '+state.coins+'</p><p>Math Progress</p><div class="bar"><div style="width:'+state.math+'%"></div></div><p>Reading Progress</p><div class="bar"><div style="width:'+state.reading+'%"></div></div></div><button class="btn pink" onclick="resetApp()">Reset Demo</button>')};
window.resetApp=function(){if(confirm('Reset all WonderQuest progress?')){state={stars:0,coins:0,math:0,reading:0,done:[],certs:[]};save();home()}};
})();
</script>
</body>
</html>
