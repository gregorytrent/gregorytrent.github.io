<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WonderQuest Kids</title>
<style>
:root{--p:#7C5CFF;--y:#FFD84D;--b:#5EC8FF;--r:#FF7A8A;--g:#62D26F;--w:#FFFBF2;--n:#24304F}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Trebuchet MS",sans-serif;background:linear-gradient(135deg,var(--b),#e9fbff);color:var(--n)}.wrap{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:18px}.screen{width:min(940px,100%);min-height:650px;background:var(--w);border-radius:32px;padding:24px;box-shadow:0 20px 55px rgba(0,0,0,.18)}h1{font-size:clamp(38px,7vw,70px);text-align:center;margin:10px 0}h2{font-size:30px;margin:14px 0}p{font-size:20px;line-height:1.4}.hero{width:122px;height:122px;border-radius:50%;margin:0 auto 12px;background:linear-gradient(135deg,var(--p),var(--r));display:flex;align-items:center;justify-content:center;font-size:64px}.card{background:white;border-radius:26px;padding:20px;margin:14px 0;box-shadow:0 10px 25px rgba(36,48,79,.14)}.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}.btn{border:0;border-radius:999px;padding:18px 24px;font-size:20px;font-weight:800;background:var(--p);color:white;box-shadow:0 7px 0 rgba(36,48,79,.22);cursor:pointer}.btn:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(36,48,79,.22)}.small{font-size:15px;padding:10px 14px}.yellow{background:var(--y);color:var(--n)}.pink{background:var(--r)}.green{background:var(--g);color:var(--n)}.blue{background:var(--b);color:var(--n)}.badge{background:var(--y);border-radius:999px;padding:10px 16px;font-weight:800;display:inline-block}.tile{border:0;border-radius:28px;padding:24px;min-height:145px;font-size:23px;font-weight:900;color:white}.tile span{display:block;font-size:50px}.bubble{width:118px;height:118px;border-radius:50%;border:0;background:radial-gradient(circle at 30% 25%,white,var(--b) 35%,var(--p));font-size:42px;color:white;font-weight:900}.letter{width:100px;height:100px;border-radius:22px;border:4px solid var(--n);background:var(--y);font-size:44px;font-weight:900}.word{display:inline-block;border:5px solid var(--p);background:white;border-radius:24px;padding:18px 28px;font-size:56px;letter-spacing:9px;font-weight:900}.bar{height:20px;background:#e7e7ef;border-radius:999px;overflow:hidden}.bar div{height:100%;background:var(--g)}input{font-size:22px;padding:14px;border-radius:16px;border:3px solid #ddd;width:100%}.cert{border:8px double var(--p);background:linear-gradient(135deg,#fff,#fff6bf);text-align:center}@media(max-width:600px){.wrap{padding:0}.screen{border-radius:0;min-height:100vh}.bubble,.letter{width:88px;height:88px;font-size:34px}}
</style>
</head>
<body><div id="app"></div><script>
var state={active:'Emma',profiles:{Emma:{stars:0,coins:0,math:0,read:0,done:[],certs:[]}},pin:null};
try{var saved=localStorage.getItem('wonderquest_stable_v1');if(saved){state=JSON.parse(saved)}}catch(e){}
var score=0,round=1,total=5,problem=null,letterGame=null;
var words=['CAT','DOG','SUN','HAT','BUG','MAP','FOX','BED','PEN','CUP','FISH','MOON'];
function save(){localStorage.setItem('wonderquest_stable_v1',JSON.stringify(state))}
function current(){return state.profiles[state.active]}
function badge(label,icon,num){return '<span class="badge">'+icon+' '+num+' '+label+'</span>'}
function top(title){var p=current();return '<div class="row" style="justify-content:space-between"><button class="btn small blue" onclick="home()">Home</button><b>'+title+'</b><div>'+badge('Stars','⭐',p.stars)+' '+badge('Coins','🪙',p.coins)+'</div></div>'}
function show(html){document.getElementById('app').innerHTML='<div class="wrap"><main class="screen">'+html+'</main></div>'}
function speak(text){try{if(!window.speechSynthesis)return;window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.rate=.9;window.speechSynthesis.speak(u)}catch(e){}}
function home(){var p=current();show('<div class="hero">🦊</div><h1>WonderQuest Kids</h1><p style="text-align:center;font-size:23px">Where little minds go on big adventures</p><div class="card"><p><b>Nova says:</b> Welcome back, '+state.active+'! Ready to make WonderWorld shine?</p></div><div class="row"><button class="btn" onclick="map()">▶ Play</button><button class="btn pink" onclick="profiles()">👤 Profiles</button><button class="btn yellow" onclick="badges()">🏆 Badges</button><button class="btn green" onclick="store()">🛍 Store</button><button class="btn blue" onclick="daily()">🚩 Daily</button><button class="btn" onclick="parentLock()">🔒 Parent</button></div><div class="row" style="margin-top:20px">'+badge('Stars','⭐',p.stars)+' '+badge('Coins','🪙',p.coins)+'</div>');speak('Welcome to WonderQuest Kids')}
function profiles(){var html=top('Profiles')+'<div class="grid">';Object.keys(state.profiles).forEach(function(n){var p=state.profiles[n];html+='<div class="card"><h2>'+n+'</h2><p>⭐ '+p.stars+'<br>🪙 '+p.coins+'</p><button class="btn green" onclick="choose(\''+n+'\')">Choose</button></div>'});html+='<div class="card"><h2>Add Explorer</h2><input id="name" placeholder="Child name"><br><br><button class="btn" onclick="addProfile()">Add</button></div></div>';show(html)}
function choose(n){state.active=n;save();home()}function addProfile(){var n=document.getElementById('name').value.trim()||'New Explorer';state.profiles[n]={stars:0,coins:0,math:0,read:0,done:[],certs:[]};state.active=n;save();home()}
function map(){show(top('Map')+'<h2>Choose a Learning World</h2><div class="grid"><button class="tile" style="background:var(--g)" onclick="startMath()"><span>🔢</span>Number Valley</button><button class="tile" style="background:var(--b)" onclick="startLetters()"><span>🔤</span>Letter Lagoon</button><button class="tile" style="background:var(--p)" onclick="alert(\'Shape Castle is coming next.\')"><span>△</span>Shape Castle</button><button class="tile" style="background:var(--r)" onclick="badges()"><span>🏆</span>Reward Village</button></div>')}
function startMath(){score=0;round=1;nextMath()}function nextMath(){var p=current();var max=Math.min(5+Math.floor(p.math/10),20);var a=1+Math.floor(Math.random()*max);var b=1+Math.floor(Math.random()*max);var ans=a+b;var choices=[ans];while(choices.length<3){var w=ans+Math.floor(Math.random()*7)-3;if(w>0&&choices.indexOf(w)<0)choices.push(w)}choices.sort(function(){return Math.random()-.5});problem={a:a,b:b,ans:ans,choices:choices};showMath('Pop the bubble with the right answer!')}
function showMath(msg){var html=top('Bubble Pop Addition')+'<div class="card"><p><b>Nova:</b> '+msg+'</p></div><h1>'+problem.a+' + '+problem.b+' = ?</h1><p style="text-align:center">Round '+round+'/'+total+' • Score '+score+'</p><div class="row">';problem.choices.forEach(function(x){html+='<button class="bubble" onclick="answerMath('+x+')">'+x+'</button>'});html+='</div>';show(html);speak(msg)}
function answerMath(x){if(x===problem.ans){score++;if(round>=total){complete('Bubble Pop Addition','bubble','math');return}round++;showMath('Fantastic! You popped the right bubble!');setTimeout(nextMath,650)}else{showMath('Nice try! Count carefully and try again.')}}
function startLetters(){score=0;round=1;nextLetter()}function nextLetter(){var word=words[Math.floor(Math.random()*words.length)];var idx=Math.floor(Math.random()*word.length);var target=word.charAt(idx);var choices=[target];while(choices.length<4){var c=String.fromCharCode(65+Math.floor(Math.random()*26));if(choices.indexOf(c)<0)choices.push(c)}choices.sort(function(){return Math.random()-.5});letterGame={word:word,idx:idx,target:target,choices:choices};showLetters('Find the missing treasure letter!')}
function showLetters(msg){var hidden=letterGame.word.substring(0,letterGame.idx)+'_'+letterGame.word.substring(letterGame.idx+1);var html=top('Letter Treasure Hunt')+'<div class="card"><p><b>Captain Splash:</b> '+msg+'</p></div><div style="text-align:center"><div class="word">'+hidden+'</div><p>Word: '+letterGame.word+'</p><p>Round '+round+'/'+total+' • Score '+score+'</p></div><div class="row">';letterGame.choices.forEach(function(x){html+='<button class="letter" onclick="answerLetter(\''+x+'\')">'+x+'</button>'});html+='</div>';show(html);speak(msg)}
function answerLetter(x){if(x===letterGame.target){score++;if(round>=total){complete('Letter Treasure Hunt','letters','reading');return}round++;showLetters('Amazing! You found the treasure letter!');setTimeout(nextLetter,650)}else{showLetters('Good try! Look at the word and try again.')}}
function complete(title,id,type){var p=current();p.stars+=5;p.coins+=20;if(p.done.indexOf(id)<0)p.done.push(id);if(type==='math')p.math=Math.min(100,p.math+10);else p.read=Math.min(100,p.read+10);if(score>=4&&!p.certs.some(function(c){return c.id===id})){p.certs.push({id:id,title:(type==='math'?'Math':'Reading')+' Champion',game:title,date:new Date().toLocaleDateString()})}save();show(top('Complete')+'<div style="text-align:center"><div class="hero">🏆</div><h1>'+(score===total?'Perfect Adventure!':'Great Work!')+'</h1><h2>'+title+'</h2><div class="card"><p><b>Score:</b> '+score+'/'+total+'</p><div class="row">'+badge('Stars','⭐',5)+' '+badge('Coins','🪙',20)+'</div></div><div class="row"><button class="btn" onclick="'+(id==='bubble'?'startMath()':'startLetters()')+'">Play Again</button><button class="btn pink" onclick="map()">Map</button></div></div>');speak('Great work. You earned stars and coins.')}
function badges(){var p=current();var items=[['Addition Champion','➕',p.done.indexOf('bubble')>=0],['Letter Explorer','🔤',p.done.indexOf('letters')>=0],['Star Collector','⭐',p.stars>=25],['Coin Saver','🪙',p.coins>=100],['Math Explorer','🧮',p.math>=25],['Reading Explorer','📚',p.read>=25]];var html=top('Badges')+'<div class="grid">';items.forEach(function(b){html+='<div class="card" style="text-align:center;opacity:'+(b[2]?1:.5)+'"><div style="font-size:54px">'+(b[2]?b[1]:'🔒')+'</div><h2>'+b[0]+'</h2><p>'+(b[2]?'Earned!':'Keep exploring!')+'</p></div>'});html+='</div><h2>Certificates</h2>';if(p.certs.length){p.certs.forEach(function(c){html+='<div class="card cert"><h2>Certificate of Achievement</h2><h1>'+state.active+'</h1><p>'+c.title+'</p><p>'+c.game+'</p><p>'+c.date+'</p></div>'})}else html+='<div class="card"><p>No certificates yet. Score 4 or better to earn one.</p></div>';show(html)}
function store(){show(top('Store')+'<div class="card"><p><b>Nova:</b> Spend coins on fun rewards. No real money. Learning powers the store!</p></div><div class="grid"><div class="card"><h2>🧙 Wizard Outfit</h2><p>50 coins</p><button class="btn small" onclick="buy(50)">Unlock</button></div><div class="card"><h2>🐉 Baby Dragon</h2><p>100 coins</p><button class="btn small" onclick="buy(100)">Unlock</button></div></div>')}function buy(c){var p=current();if(p.coins<c){alert('Not enough coins yet. Keep learning!');return}p.coins-=c;save();alert('Unlocked!');store()}
function daily(){show(top('Daily')+'<div class="card"><h2>🚩 Math Explorer</h2><p>Play Bubble Pop Addition.</p><button class="btn" onclick="startMath()">Go</button></div><div class="card"><h2>🚩 Letter Hunter</h2><p>Play Letter Treasure Hunt.</p><button class="btn" onclick="startLetters()">Go</button></div>')}
function parentLock(){if(!state.pin){show(top('Create PIN')+'<div class="card"><h2>Create Parent PIN</h2><input id="p1" maxlength="4" type="password" placeholder="4-digit PIN"><br><br><input id="p2" maxlength="4" type="password" placeholder="Confirm PIN"><br><br><button class="btn" onclick="setPin()">Save</button></div>')}else{show(top('Parent Lock')+'<div class="card"><h2>Parent Zone</h2><input id="pin" maxlength="4" type="password" placeholder="PIN"><br><br><button class="btn" onclick="unlock()">Unlock</button></div>')}}function setPin(){var a=document.getElementById('p1').value,b=document.getElementById('p2').value;if(a.length!==4||a!==b){alert('Enter matching 4-digit PINs.');return}state.pin=a;save();dash()}function unlock(){if(document.getElementById('pin').value!==state.pin){alert('That PIN did not work.');return}dash()}function dash(){var p=current();show(top('Parent Dashboard')+'<div class="card"><h2>Child: '+state.active+'</h2><p>Stars: '+p.stars+'<br>Coins: '+p.coins+'</p><p>Math Progress</p><div class="bar"><div style="width:'+p.math+'%"></div></div><p>Reading Progress</p><div class="bar"><div style="width:'+p.read+'%"></div></div></div><button class="btn pink" onclick="reset()">Reset Demo</button>')}function reset(){if(confirm('Reset all demo data?')){state=JSON.parse(JSON.stringify({active:'Emma',profiles:{Emma:{stars:0,coins:0,math:0,read:0,done:[],certs:[]}},pin:null}));save();home()}}
home();
</script></body></html>
