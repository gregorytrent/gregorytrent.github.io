<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WonderQuest Kids</title>
<style>
:root{--p:#7C5CFF;--y:#FFD84D;--b:#5EC8FF;--r:#FF7A8A;--g:#62D26F;--w:#FFFBF2;--n:#24304F}*{box-sizing:border-box}body{margin:0;font-family:Arial Rounded MT Bold,Trebuchet MS,Arial,sans-serif;background:linear-gradient(135deg,var(--b),#e9fbff);color:var(--n)}.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.screen{width:min(950px,100%);min-height:680px;background:var(--w);border-radius:34px;padding:24px;box-shadow:0 20px 60px #0003;position:relative;overflow:hidden}.screen:before{content:"";position:absolute;inset:-80px;background:radial-gradient(circle at 15% 20%,#ffd84d66,transparent 20%),radial-gradient(circle at 85% 12%,#ff7a8a44,transparent 18%),radial-gradient(circle at 72% 92%,#62d26f55,transparent 23%)}.content{position:relative;z-index:1}h1{font-size:clamp(40px,7vw,72px);text-align:center;margin:.2em 0}h2{font-size:32px;margin:14px 0}p{font-size:20px;line-height:1.4}.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}.card{background:#fff;border-radius:28px;padding:22px;margin:14px 0;box-shadow:0 10px 28px #24304f22}.btn{border:0;border-radius:999px;padding:18px 26px;font-size:21px;font-weight:900;background:var(--p);color:white;box-shadow:0 8px 0 #24304f33;cursor:pointer;min-width:175px}.btn:active{transform:translateY(4px);box-shadow:0 3px 0 #24304f33}.yellow{background:var(--y);color:var(--n)}.green{background:var(--g);color:var(--n)}.pink{background:var(--r)}.blue{background:var(--b);color:var(--n)}.small{font-size:16px;padding:10px 14px;min-width:auto}.hero{width:125px;height:125px;border-radius:50%;margin:0 auto 10px;background:linear-gradient(135deg,var(--p),var(--r));display:flex;align-items:center;justify-content:center;font-size:66px;animation:f 2.4s infinite ease-in-out}@keyframes f{50%{transform:translateY(-8px)}}.badge{display:inline-flex;gap:8px;background:var(--y);border-radius:999px;padding:12px 18px;font-weight:900}.tile{min-height:145px;border:0;border-radius:30px;color:#fff;font-size:24px;font-weight:900;padding:18px;box-shadow:0 10px 24px #0002}.tile span{display:block;font-size:52px}.bubble{width:125px;height:125px;border-radius:50%;border:0;background:radial-gradient(circle at 30% 25%,#fff,var(--b) 35%,var(--p));color:white;font-size:44px;font-weight:900}.letter{width:110px;height:110px;border-radius:24px;border:4px solid var(--n);background:var(--y);font-size:48px;font-weight:900}.word{display:inline-block;background:#fff;border:5px solid var(--p);border-radius:26px;padding:20px 32px;font-size:62px;letter-spacing:10px;font-weight:900}.bar{height:20px;background:#e8e8ef;border-radius:999px;overflow:hidden}.bar div{height:100%;background:var(--g)}.cert{border:8px double var(--p);background:linear-gradient(135deg,#fff,#fff7c7);text-align:center}input{font-size:24px;padding:14px;border-radius:18px;border:3px solid #ddd;width:100%}@media(max-width:600px){.wrap{padding:0}.screen{border-radius:0;min-height:100vh}.bubble,.letter{width:92px;height:92px;font-size:36px}}
</style>
</head>
<body><div id="app"></div>
<script>
const K='wqkids_live_v1',base={active:'Emma',profiles:{Emma:{stars:0,coins:0,math:0,read:0,done:[],certs:[],daily:''}},pin:null,narrate:true};let s=JSON.parse(localStorage.getItem(K)||'null')||structuredClone(base),score=0,round=1,total=5,prob=null,ltr=null;const words=['CAT','DOG','SUN','HAT','BUG','MAP','FOX','BED','PEN','CUP','FISH','MOON'];function save(){localStorage.setItem(K,JSON.stringify(s))}function p(){return s.profiles[s.active]}function ui(x){document.getElementById('app').innerHTML=`<div class="wrap"><main class="screen"><div class="content">${x}</div></main></div>`}function say(t){if(!s.narrate||!speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.88;speechSynthesis.speak(u)}function badge(a,b,n){return `<span class="badge">${b} ${n} ${a}</span>`}function top(t=''){let x=p();return `<div class="row" style="justify-content:space-between"><button class="btn small blue" onclick="home()">🏠 Home</button><b>${t}</b><div>${badge('Stars','⭐',x.stars)} ${badge('Coins','🪙',x.coins)}</div></div>`}function home(){let x=p();ui(`<div class="hero">🦊</div><h1>WonderQuest Kids</h1><p style="text-align:center;font-size:23px">Where little minds go on big adventures</p><div class="card"><p><b>Nova says:</b> Welcome back, ${s.active}! Ready to make WonderWorld shine?</p></div><div class="row"><button class="btn" onclick="map()">▶ Play</button><button class="btn pink" onclick="profiles()">👤 Profiles</button><button class="btn yellow" onclick="badges()">🏆 Badges</button><button class="btn green" onclick="customize()">🎨 Customize</button><button class="btn blue" onclick="store()">🛍 Store</button><button class="btn pink" onclick="daily()">🚩 Daily</button><button class="btn" onclick="parentLock()">🔒 Parent</button></div><div class="row" style="margin-top:20px">${badge('Stars','⭐',x.stars)} ${badge('Coins','🪙',x.coins)}</div>`);say('Welcome to WonderQuest Kids')}function profiles(){ui(`${top('Profiles')}<div class="grid">${Object.keys(s.profiles).map(n=>`<div class="card"><h2>${n}</h2><p>⭐ ${s.profiles[n].stars}<br>🪙 ${s.profiles[n].coins}</p><button class="btn green" onclick="s.active='${n}';save();home()">Choose</button></div>`).join('')}<div class="card"><h2>Add Explorer</h2><input id="nm" placeholder="Name"><br><br><button class="btn" onclick="add()">Add</button></div></div>`)}function add(){let n=document.getElementById('nm').value.trim()||'New Explorer';s.profiles[n]=structuredClone(base.profiles.Emma);s.active=n;save();home()}function map(){ui(`${top('Map')}<h2>Choose a Learning World</h2><div class="grid"><button class="tile" style="background:var(--g)" onclick="startMath()"><span>🔢</span>Number Valley</button><button class="tile" style="background:var(--b)" onclick="startLetters()"><span>🔤</span>Letter Lagoon</button><button class="tile" style="background:var(--p)" onclick="alert('Shape Castle is coming next.')"><span>△</span>Shape Castle</button><button class="tile" style="background:var(--r)" onclick="badges()"><span>🏆</span>Reward Village</button></div>`)}function startMath(){score=0;round=1;nextMath()}function nextMath(){let m=Math.min(5+Math.floor(p().math/10),20),a=1+Math.floor(Math.random()*m),b=1+Math.floor(Math.random()*m),ans=a+b,set=new Set([ans]);while(set.size<3){let w=ans+Math.floor(Math.random()*7)-3;if(w>0)set.add(w)}prob={a,b,ans,choices:[...set].sort(()=>Math.random()-.5)};showMath()}function showMath(msg='Pop the bubble with the right answer!'){ui(`${top('Bubble Pop Addition')}<div class="card"><p><b>Nova:</b> ${msg}</p></div><h1>${prob.a} + ${prob.b} = ?</h1><p style="text-align:center">Round ${round}/${total} • Score ${score}</p><div class="row">${prob.choices.map(x=>`<button class="bubble" onclick="ansMath(${x})">${x}</button>`).join('')}</div>`);say(msg)}function ansMath(x){if(x===prob.ans){score++;if(round>=total)return complete('Bubble Pop Addition','bubble','math');round++;showMath('Fantastic! You popped the right bubble!');setTimeout(nextMath,650)}else showMath('Nice try! Count carefully and try again.')}function startLetters(){score=0;round=1;nextLetter()}function nextLetter(){let word=words[Math.floor(Math.random()*words.length)],i=Math.floor(Math.random()*word.length),target=word[i],set=new Set([target]);while(set.size<4)set.add(String.fromCharCode(65+Math.floor(Math.random()*26)));ltr={word,i,target,choices:[...set].sort(()=>Math.random()-.5)};showLetters()}function showLetters(msg='Find the missing treasure letter!'){let h=ltr.word.slice(0,ltr.i)+'_'+ltr.word.slice(ltr.i+1);ui(`${top('Letter Treasure Hunt')}<div class="card"><p><b>Captain Splash:</b> ${msg}</p></div><div style="text-align:center"><div class="word">${h}</div><p>Word: ${ltr.word}</p><p>Round ${round}/${total} • Score ${score}</p></div><div class="row">${ltr.choices.map(x=>`<button class="letter" onclick="ansLetter('${x}')">${x}</button>`).join('')}</div>`);say(msg)}function ansLetter(x){if(x===ltr.target){score++;if(round>=total)return complete('Letter Treasure Hunt','letters','reading');round++;showLetters('Amazing! You found the treasure letter!');setTimeout(nextLetter,650)}else showLetters('Good try! Look at the word and try again.')}function complete(title,id,type){let x=p();x.stars+=5;x.coins+=20;if(!x.done.includes(id))x.done.push(id);if(type==='math')x.math=Math.min(100,x.math+10);else x.read=Math.min(100,x.read+10);if(score>=4&&!x.certs.find(c=>c.id===id))x.certs.push({id,title:(type==='math'?'Math':'Reading')+' Champion',game:title,date:new Date().toLocaleDateString()});save();ui(`${top('Complete')}<div style="text-align:center"><div class="hero">🏆</div><h1>${score===total?'Perfect Adventure!':'Great Work!'}</h1><h2>${title}</h2><div class="card"><p><b>Score:</b> ${score}/${total}</p><div class="row">${badge('Stars','⭐',5)} ${badge('Coins','🪙',20)}</div></div><div class="row"><button class="btn" onclick="${id==='bubble'?'startMath()':'startLetters()'}">🔁 Play Again</button><button class="btn pink" onclick="map()">🗺 Map</button></div></div>`);say('Great work. You earned stars and coins.')}function badges(){let x=p(),arr=[['Addition Champion','➕',x.done.includes('bubble')],['Letter Explorer','🔤',x.done.includes('letters')],['Star Collector','⭐',x.stars>=25],['Coin Saver','🪙',x.coins>=100],['Math Explorer','🧮',x.math>=25],['Reading Explorer','📚',x.read>=25]];ui(`${top('Badges')}<div class="grid">${arr.map(b=>`<div class="card" style="text-align:center;opacity:${b[2]?1:.5}"><div style="font-size:54px">${b[2]?b[1]:'🔒'}</div><h2>${b[0]}</h2><p>${b[2]?'Earned!':'Keep exploring!'}</p></div>`).join('')}</div><h2>Certificates</h2>${x.certs.length?x.certs.map(c=>`<div class="card cert"><h2>Certificate of Achievement</h2><h1>${s.active}</h1><p>${c.title}</p><p>${c.game}</p><p>${c.date}</p></div>`).join(''):'<div class="card"><p>No certificates yet. Score 4 or better to earn one.</p></div>'}`)}function customize(){ui(`${top('Customize')}<div class="card" style="text-align:center"><div class="hero">🦊</div><h2>Explorer Outfit</h2><p>Pet: Fox Cub</p></div><div class="row"><button class="btn green">Wizard</button><button class="btn pink">Astronaut</button><button class="btn blue">Baby Dragon</button></div>`)}function store(){ui(`${top('Store')}<div class="card"><p><b>Nova:</b> Spend coins on fun rewards. No real money. Learning powers the store!</p></div><div class="grid">${['Wizard Outfit','Astronaut Outfit','Baby Dragon','Puppy','Rainbow Trail','Castle Room'].map((it,i)=>`<div class="card" style="text-align:center"><div style="font-size:54px">${['🧙','🚀','🐉','🐶','🌈','🏰'][i]}</div><h2>${it}</h2><p>${50+i*25} coins</p><button class="btn small" onclick="buy(${50+i*25},'${it}')">Unlock</button></div>`).join('')}</div>`)}function buy(c,it){if(p().coins<c)return alert('Not enough coins yet. Keep learning!');p().coins-=c;save();alert(it+' unlocked!');store()}function daily(){ui(`${top('Daily Challenges')}<div class="card"><h2>🚩 Math Explorer</h2><p>Play Bubble Pop Addition.</p><button class="btn" onclick="startMath()">Go</button></div><div class="card"><h2>🚩 Letter Hunter</h2><p>Play Letter Treasure Hunt.</p><button class="btn" onclick="startLetters()">Go</button></div><div class="card"><h2>🚩 Badge Check</h2><p>Visit your Badge Wall.</p><button class="btn" onclick="badges()">Go</button></div>`)}function parentLock(){if(!s.pin)ui(`${top('Create PIN')}<div class="card"><h2>Create Parent PIN</h2><input id="p1" maxlength="4" type="password" placeholder="4-digit PIN"><br><br><input id="p2" maxlength="4" type="password" placeholder="Confirm PIN"><br><br><button class="btn" onclick="setPin()">Save</button></div>`);else ui(`${top('Parent Lock')}<div class="card"><h2>Parent Zone</h2><input id="pin" maxlength="4" type="password" placeholder="PIN"><br><br><button class="btn" onclick="unlock()">Unlock</button></div>`)}function setPin(){let a=document.getElementById('p1').value,b=document.getElementById('p2').value;if(a.length!==4||a!==b)return alert('Enter matching 4-digit PINs.');s.pin=a;save();dash()}function unlock(){if(document.getElementById('pin').value!==s.pin)return alert('That PIN did not work.');dash()}function dash(){let x=p();ui(`${top('Parent Dashboard')}<div class="card"><h2>Child: ${s.active}</h2><p>Stars: ${x.stars}<br>Coins: ${x.coins}</p><p>Math Progress</p><div class="bar"><div style="width:${x.math}%"></div></div><p>Reading Progress</p><div class="bar"><div style="width:${x.read}%"></div></div></div><div class="row"><button class="btn green" onclick="badges()">Certificates</button><button class="btn pink" onclick="reset()">Reset Demo</button></div>`)}function reset(){if(!confirm('Reset all demo data?'))return;s=structuredClone(base);save();home()}home();
</script></body></html>
