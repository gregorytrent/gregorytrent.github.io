<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Let's Get Your Zoom Working</title>
<style>:root{--b:#2563eb;--g:#14834b;--ink:#17263a;--muted:#64748b;--line:#dbe4ee;--bg:#f5f8fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}main{max-width:620px;margin:auto;padding:24px 16px 100px}.head{text-align:center;margin:8px 0 22px}.head .i{font-size:48px}.head h1{font-size:29px;margin:5px 0}.head p{color:var(--muted);font-size:17px;line-height:1.45;margin:8px auto;max-width:460px}.card{background:#fff;border:1px solid #e6edf5;border-radius:22px;padding:22px;box-shadow:0 10px 30px #18385812}.progress{height:7px;background:#e9eef5;border-radius:20px;overflow:hidden;margin-bottom:22px}.bar{height:100%;background:var(--b);transition:.25s}.tag{font-size:13px;font-weight:800;color:var(--b);text-transform:uppercase;letter-spacing:.07em}h2{font-size:25px;line-height:1.2;margin:8px 0 18px}.choices{display:grid;gap:11px}button{width:100%;border:1px solid var(--line);background:white;border-radius:15px;padding:17px 15px;text-align:left;font-size:17px;font-weight:650;color:var(--ink)}button:active{background:#f1f5ff}.action{background:var(--b);border-color:var(--b);color:white;text-align:center}.success{background:var(--g);border-color:var(--g);color:white;text-align:center}.step{background:#f4f7fb;padding:17px;border-radius:15px;font-size:18px;line-height:1.5;margin:14px 0}.note{color:var(--muted);font-size:15px;line-height:1.5}.nav{display:flex;gap:10px;margin-top:20px}.nav button{font-size:14px;padding:11px;text-align:center}.hide{display:none}</style></head>
<body><main><div class="head"><div class="i">🎥</div><h1>Let’s Get Your Zoom Working</h1><p>I’ll ask you a few simple questions. Just tap the answer that looks most like what you see on your phone.</p></div><div class="card"><div class="progress"><div id="bar" class="bar"></div></div><div id="screen"></div><div class="nav"><button id="back" class="hide" onclick="back()">← Go Back</button><button onclick="start()">Start Over</button></div></div></main>
<script>
const q={
start:["What happens when you try to join your Zoom meeting?",[["The Zoom meeting never opens","opens"],["Zoom opens, but I can’t get into the meeting","join"],["I get in, but I can’t hear anyone","hear"],["People can’t hear me","talk"],["People can’t see me","see"],["The screen freezes or keeps loading","load"],["I see an error message","err"],["I’m not sure what’s wrong","unsure"]]],
opens:["When you tap the meeting link, what happens?",[["Nothing happens","appcheck"],["A webpage opens instead of Zoom","web"],["My phone asks what app to use","choosezoom"]]],
appcheck:["Can you find the Zoom Workplace app on your phone?",[["Yes, I see it","openapp"],["No, I don’t see it","install"],["I see it, but it won’t open","update"]]],
web:["On that webpage, do you see a button that says Open Zoom or Launch Meeting?",[["Yes, I see it","launch"],["No, I don’t see it","openapp"],["I’m not sure","openapp"]]],
join:["What do you see when Zoom stops you from joining?",[["It asks for a Meeting ID or passcode","info"],["It says the Meeting ID or passcode is wrong","fresh"],["It says Waiting Room / Waiting for host","waiting"],["It asks me to sign in","signin"],["It just keeps loading","load"],["None of these","openapp"]]],
hear:["While you are in the meeting, do you see Join Audio on the screen?",[["Yes","audio"],["No","sound"],["I’m not sure","audio"]]],
talk:["When you tap the microphone button, what happens?",[["It turns on, but people still can’t hear me","mic"],["It won’t let me turn it on","hostmute"],["My phone asks about microphone access","mic"],["I’m not sure","mic"]]],
see:["When you tap Start Video, what happens?",[["My phone asks about camera access","cam"],["The picture stays black","cam"],["I don’t see a Start Video button","hostcam"],["I’m not sure","cam"]]],
load:["Are websites and other apps working normally on your phone?",[["Yes","switch"],["No, they’re slow too","internet"],["I’m not sure","switch"]]],
err:["What does the message look like?",[["Invalid Meeting ID","fresh"],["Incorrect passcode","fresh"],["Unable to connect / network error","switch"],["Zoom keeps stopping or closing","update"],["Something else","screenshot"]]],
unsure:["No problem. Let’s start with an easy check. Can you open the Zoom Workplace app on your phone?",[["Yes","openapp"],["No","install"],["I’m not sure where it is","install"]]]
};
const fixes={
choosezoom:["Choose Zoom Workplace",["When your phone asks which app to use, tap <b>Zoom Workplace</b>.","If you see <b>Always</b>, tap it so Zoom links open correctly next time."]],
openapp:["Let’s join without using the link",["Open the <b>Zoom Workplace</b> app.","Tap <b>Join</b>.","Look at the meeting invitation and type in the <b>Meeting ID</b>.","If it asks for a passcode, type the passcode from the invitation."]],
install:["Let’s make sure Zoom is installed",["Open the <b>Play Store</b> on your phone.","Tap the search box and type <b>Zoom Workplace</b>.","Tap <b>Install</b>.","When it finishes, tap <b>Open</b> and then try your meeting again."]],
update:["Let’s refresh Zoom",["Open the <b>Play Store</b>.","Search for <b>Zoom Workplace</b>.","If you see <b>Update</b>, tap it.","When it finishes, restart your phone and try Zoom again."]],
launch:["Open the meeting in Zoom",["Tap <b>Open Zoom</b> or <b>Launch Meeting</b> on the webpage.","If your phone asks which app to use, tap <b>Zoom Workplace</b>."]],
info:["Use the information from your invitation",["Go back to the text, email, or invitation that has the Zoom meeting.","Find the <b>Meeting ID</b> and <b>Passcode</b>.","Return to Zoom and enter them exactly as shown."]],
fresh:["The meeting information may be the problem",["Ask the person hosting the meeting to send you a <b>new Zoom link</b>.","Tap the new link they send you.","If that still fails, ask them to confirm the Meeting ID and passcode."]],
waiting:["Good news — your Zoom is working",["If you see <b>Waiting Room</b> or <b>Waiting for host</b>, your phone has reached the meeting.","Stay on that screen. The host needs to start the meeting or let you in.","If it takes too long, call or text the host and ask them to admit you."]],
signin:["Zoom wants you to sign in",["Tap <b>Sign In</b>.","Sign in with the email address you normally use for Zoom.","Then tap the meeting link again.","If it still refuses you, ask the host whether you need to use a specific email address."]],
audio:["Turn on the meeting sound",["Tap <b>Join Audio</b>.","Choose the option for audio over Wi-Fi or mobile data.","Press the <b>Volume Up</b> button on the side of your phone a few times."]],
sound:["Let’s make sure the sound isn’t going somewhere else",["Press <b>Volume Up</b> while the Zoom meeting is open.","Swipe down from the top of your phone and turn <b>Bluetooth off</b> temporarily.","Go back to Zoom and listen again."]],
mic:["Let Zoom use your microphone",["Leave Zoom for a moment and open <b>Settings</b>.","Tap <b>Apps</b>, then find and tap <b>Zoom</b>.","Tap <b>Permissions</b>.","Tap <b>Microphone</b>.","Choose <b>Allow only while using the app</b>.","Go back to Zoom and try speaking again."]],
hostmute:["The meeting host may have you muted",["Tell the meeting host that you cannot unmute yourself.","Ask the host to allow you to unmute.","When Zoom gives you the option, tap <b>Unmute</b>."]],
cam:["Let Zoom use your camera",["Leave Zoom for a moment and open <b>Settings</b>.","Tap <b>Apps</b>, then find and tap <b>Zoom</b>.","Tap <b>Permissions</b>.","Tap <b>Camera</b>.","Choose <b>Allow only while using the app</b>.","Go back to Zoom and tap <b>Start Video</b>."]],
hostcam:["The host may have video turned off",["Ask the meeting host if participants are allowed to turn on their cameras.","If the host says yes, tap the Zoom screen once and look again for <b>Start Video</b>."]],
switch:["Let’s try a different internet connection",["Leave the Zoom meeting.","Swipe down from the top of your phone.","If you are on Wi-Fi, turn <b>Wi-Fi off</b> and try the meeting using your phone’s mobile data.","If you are already using mobile data, connect to a good Wi-Fi network and try again."]],
internet:["Let’s get the phone back online first",["Swipe down from the top of your phone.","Turn <b>Airplane mode on</b>.","Wait about 10 seconds, then turn it <b>off</b>.","Try opening a normal website.","When the internet is working, try Zoom again."]],
screenshot:["Let’s capture exactly what Zoom is telling you",["Take a <b>screenshot</b> of the message on the screen.","Do not worry about fixing anything else yet.","Send that screenshot to the person helping you so they can see the exact message."]]
};
let cur="start",history=[],count=0;
function draw(id){cur=id;count++;document.getElementById("bar").style.width=Math.min(15+count*13,100)+"%";document.getElementById("back").classList.toggle("hide",!history.length);let s=document.getElementById("screen");if(q[id]){s.innerHTML='<div class="tag">Just tap one answer</div><h2>'+q[id][0]+'</h2><div class="choices">'+q[id][1].map(x=>'<button onclick="pick(\''+x[1]+'\')">'+x[0]+' <span style="float:right">›</span></button>').join('')+'</div>'}else fix(id)}
function pick(id){history.push(cur);draw(id)}
function fix(id){let f=fixes[id];document.getElementById("bar").style.width="100%";document.getElementById("screen").innerHTML='<div class="tag">Try this</div><h2>'+f[0]+'</h2>'+f[1].map((x,i)=>'<div class="step"><b>Step '+(i+1)+'</b><br>'+x+'</div>').join('')+'<h2 style="font-size:20px;margin-top:24px">Did that fix it?</h2><div class="choices"><button class="success" onclick="done()">Yes — it works now ✓</button><button onclick="more()">No — I still need help</button></div>'}
function done(){document.getElementById("screen").innerHTML='<div style="text-align:center"><div style="font-size:62px">🎉</div><h2 style="color:var(--g)">Great — you’re ready for your Zoom call!</h2><p class="note">You can close this page and go back to your meeting.</p></div>'}
function more(){document.getElementById("screen").innerHTML='<div class="tag">Still not working</div><h2>That’s okay. Let’s get someone a clear picture of the problem.</h2><div class="step"><b>Step 1</b><br>Restart your phone.</div><div class="step"><b>Step 2</b><br>Try the Zoom meeting one more time.</div><div class="step"><b>Step 3</b><br>If it still does not work, take a screenshot of what you see and send it to the person helping you.</div><p class="note">A screenshot of the exact message is much more useful than changing more settings.</p>'}
function back(){if(!history.length)return;let x=history.pop();count=Math.max(0,count-2);draw(x)}function start(){history=[];count=0;draw("start")}start();
</script></body></html>
