<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zoom Rescue — Samsung Galaxy</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#132238;--muted:#607087;--blue:#2563eb;--green:#16834a;--line:#dce4ee}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:620px;margin:auto;min-height:100vh;padding:22px 16px 110px}.brand{text-align:center;margin:10px 0 20px}.brand .icon{font-size:46px}.brand h1{margin:3px 0;font-size:28px}.brand p{color:var(--muted);margin:5px 0}
.card{background:var(--card);border-radius:22px;padding:22px;box-shadow:0 10px 35px #19385c14;border:1px solid #e7edf5}.progress{height:7px;background:#e6ebf2;border-radius:20px;overflow:hidden;margin-bottom:22px}.bar{height:100%;background:var(--blue);width:8%;transition:.25s}
.kicker{font-size:13px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.08em}h2{font-size:25px;line-height:1.18;margin:8px 0 10px}.sub{color:var(--muted);line-height:1.5;margin-bottom:18px}.options{display:grid;gap:11px}
.btn{width:100%;text-align:left;border:1px solid var(--line);background:#fff;padding:16px;border-radius:14px;font-size:17px;font-weight:650;color:var(--ink);cursor:pointer}.btn:active{transform:scale(.99);background:#f4f7ff}.yes{background:var(--green);color:#fff;border-color:var(--green);text-align:center}
.steps{background:#f6f9fd;border-radius:15px;padding:15px 17px;margin:16px 0}.steps ol{padding-left:22px;margin:0}.steps li{margin:9px 0;line-height:1.42}.tip{border-left:4px solid var(--blue);padding:10px 13px;background:#eef4ff;border-radius:8px;margin:14px 0;line-height:1.45}.warn{border-left-color:#e5a000;background:#fff8e6}
.footer{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.small{font-size:14px;padding:11px 13px;text-align:center}.hidden{display:none}.result h2{color:var(--green)}@media(max-width:380px){h2{font-size:22px}.btn{font-size:16px;padding:14px}}
</style></head>
<body><main class="wrap"><div class="brand"><div class="icon">🎥</div><h1>Zoom Rescue</h1><p>Samsung Galaxy phone troubleshooter</p></div><section class="card"><div class="progress"><div class="bar" id="bar"></div></div><div id="screen"></div><div class="footer"><button class="btn small hidden" id="back" onclick="goBack()">← Back</button><button class="btn small" onclick="start()">↻ Start Over</button></div></section></main>
<script>
const Q={start:{q:"What happens when you try to join the Zoom call?",s:"Pick the closest match. We’ll narrow it down from there.",o:[["I tap the link and nothing happens","linknothing"],["A webpage opens, but not Zoom","browser"],["Zoom opens, but I can't get into the meeting","cantjoin"],["I'm in, but I can't hear anyone","canthear"],["I'm in, but they can't hear me","canttalk"],["My camera doesn't work","camera"],["It freezes, crashes, or says Connecting","connection"],["I see an error message","error"]]},linknothing:{q:"Can you open the Zoom Workplace app directly?",o:[["Yes","manualjoin"],["No / it crashes","reinstall"],["I don't think Zoom is installed","install"]]},browser:{q:"When the Zoom webpage opens, what do you see?",o:[["A button asking me to open Zoom","openzoom"],["It wants me to download/install Zoom","install"],["It just stays on the webpage","manualjoin"],["I can choose Join from browser","webjoin"]]},cantjoin:{q:"What stops you from joining?",o:[["It asks for a Meeting ID or passcode","meetinginfo"],["It says the Meeting ID is invalid","invalid"],["I'm stuck in a waiting room","waiting"],["It keeps spinning / Connecting","connection"],["It asks me to sign in","signin"],["Not sure","manualjoin"]]},canthear:{q:"Do you see “Join Audio” or a headphones/audio icon?",o:[["Yes","joinaudio"],["No","volume"],["I'm not sure","joinaudio"]]},canttalk:{q:"When you tap Unmute, what happens?",o:[["It unmutes, but they still can't hear me","micperm"],["It says the host muted me / I can't unmute","hostmute"],["It asks for microphone permission","micperm"],["I'm not sure","micperm"]]},camera:{q:"What happens when you tap Start Video?",o:[["It asks for camera permission","camperm"],["Screen stays black / camera won't start","camperm"],["Camera works in other apps, not Zoom","camperm"],["I don't see Start Video","hostvideo"]]},connection:{q:"Are other apps/websites working normally right now?",o:[["Yes","networkswitch"],["No / internet is slow too","internet"],["Not sure","networkswitch"]]},error:{q:"Which message is closest?",o:[["Invalid Meeting ID","invalid"],["Incorrect passcode","meetinginfo"],["Unable to connect / network error","networkswitch"],["App keeps stopping / crashing","reinstall"],["Something different","othererror"]]}};
const F={manualjoin:["Bypass the meeting link","This tells us whether the problem is the link or Zoom itself.",["Open the <b>Zoom Workplace</b> app.","Tap <b>Join</b>.","Type the Meeting ID from the invitation.","Enter the passcode if requested.","Tap <b>Join</b>."],"If this works, the meeting link was likely the issue."],reinstall:["Refresh the Zoom app","A damaged or outdated app can cause launch, crash, camera, and connection problems.",["Open the <b>Google Play Store</b>.","Search for <b>Zoom Workplace</b>.","If you see <b>Update</b>, tap it and test again.","If it still fails: Settings → Apps → Zoom → Uninstall.","Restart the phone, reinstall Zoom Workplace, and try again."],""],install:["Install Zoom Workplace","Get the official Zoom mobile app before testing again.",["Open the <b>Google Play Store</b>.","Search <b>Zoom Workplace</b>.","Install the app published by Zoom.","Open it once, then tap the meeting link again."],""],openzoom:["Tell the browser to open Zoom","The webpage has not handed the meeting to the app.",["Tap <b>Open Zoom</b> or <b>Launch Meeting</b>.","If Android asks which app to use, choose <b>Zoom Workplace</b>.","If offered, choose <b>Always</b>.","If that fails, open Zoom directly and join with the Meeting ID."],""],webjoin:["Join in the browser","This can bypass an app-launch problem.",["Tap <b>Join from your browser</b>.","Allow microphone and camera access when asked.","Enter your name and tap <b>Join</b>."],"The host must allow browser joining."],meetinginfo:["Verify the Meeting ID and passcode","A bad or incomplete invite cannot be fixed by phone settings.",["Return to the invitation.","Copy the Meeting ID carefully.","Copy the passcode exactly.","Open Zoom Workplace → <b>Join</b> and enter them manually.","If rejected again, ask the host for a fresh invitation."],""],invalid:["Get a fresh meeting invitation","Zoom says the meeting identifier isn't valid.",["Ask the host to confirm the meeting is active.","Ask for the current Meeting ID/passcode or a fresh link.","Open Zoom Workplace → Join and enter the new details manually."],""],waiting:["Your phone is connected","The waiting room means Zoom reached the meeting successfully.",["Stay on the waiting-room screen.","Make sure your display name is recognizable.","Contact the host if you wait unusually long and ask them to admit you."],"This is generally a host/meeting setting, not a Samsung problem."],signin:["The host may require authentication","Some meetings require an authorized Zoom account.",["Tap <b>Sign In</b> in Zoom.","Use the account/email the organizer expects.","Open the invitation again.","If denied, ask the host whether a particular account is required."],""],joinaudio:["Connect the meeting audio","Being inside the meeting does not always mean audio is connected.",["Tap the screen so controls appear.","Tap <b>Join Audio</b>.","Choose the internet/Wi-Fi audio option.","Allow microphone access if asked.","Raise media volume with the side buttons."],""],volume:["Check the phone's audio output","Sound may be routed somewhere else.",["Press <b>Volume Up</b> while Zoom is open.","Turn Bluetooth off temporarily to disconnect earbuds, a car, or another speaker.","Make sure meeting audio is connected.","If still silent, leave and rejoin."],""],micperm:["Give Zoom microphone access","Android can block the microphone even while the meeting works.",["Open <b>Settings → Apps → Zoom → Permissions</b>.","Tap <b>Microphone</b> and choose <b>Allow only while using the app</b>.","Check <b>Settings → Security and privacy → Privacy controls</b> and make sure <b>Microphone access</b> is ON.","Close Zoom completely and reopen it.","Tap <b>Unmute</b> and test."],""],hostmute:["Ask the host to unmute you","The host can control whether participants may unmute.",["Tell the host you need to speak.","Ask the host to allow you to unmute.","When Zoom prompts you, tap <b>Unmute</b>."],"Phone settings cannot override a host restriction."],camperm:["Give Zoom camera access","Samsung/Android privacy controls can block Zoom's camera.",["Open <b>Settings → Apps → Zoom → Permissions</b>.","Tap <b>Camera</b> and choose <b>Allow only while using the app</b>.","Check <b>Settings → Security and privacy → Privacy controls</b> and make sure <b>Camera access</b> is ON.","Close other apps using the camera.","Reopen Zoom and tap <b>Start Video</b>."],""],hostvideo:["Check meeting restrictions","The host may have disabled participant video.",["Tap the screen to reveal controls.","Look under <b>More</b>.","Ask the host whether participant video is disabled.","If enabled, restart this troubleshooter and choose the camera problem."],""],networkswitch:["Test a different connection","This separates a Zoom problem from a network problem.",["Leave the meeting.","If using Wi-Fi, try mobile data; if using mobile data, try reliable Wi-Fi.","Turn off any VPN temporarily.","Open Zoom and try again.","If it still fails, restart the phone and retry."],""],internet:["Fix the internet connection first","Zoom needs a stable data connection.",["Turn Airplane mode on for 10 seconds, then off.","Reconnect to Wi-Fi or switch to mobile data.","Try opening a normal webpage.","Once internet works, reopen Zoom."],""],othererror:["Capture the exact error","The wording or error code tells us what to troubleshoot next.",["Take a screenshot of the error.","Write down any error number/code.","Try joining once by Meeting ID instead of the link.","If it repeats, send the screenshot/code to the person helping you."],"Capture the error before changing more settings."]};
let current="start",hist=[],depth=0;
function render(id){current=id;depth++;document.getElementById("bar").style.width=Math.min(12+depth*12,95)+"%";document.getElementById("back").classList.toggle("hidden",hist.length===0);let s=document.getElementById("screen");if(Q[id]){let x=Q[id];s.innerHTML='<div class="kicker">Question '+Math.max(1,depth)+'</div><h2>'+x.q+'</h2><div class="sub">'+(x.s||"Choose the answer that fits best.")+'</div><div class="options">'+x.o.map(a=>'<button class="btn" onclick="choose(\''+a[1]+'\')">'+a[0]+' <span style="float:right">›</span></button>').join("")+'</div>'}else showFix(id)}
function choose(n){hist.push(current);render(n)}
function showFix(id){let f=F[id],s=document.getElementById("screen");document.getElementById("bar").style.width="100%";s.innerHTML='<div class="result"><div class="kicker">Recommended next step</div><h2>✓ '+f[0]+'</h2><div class="sub">'+f[1]+'</div><div class="steps"><ol>'+f[2].map(v=>'<li>'+v+'</li>').join("")+'</ol></div>'+(f[3]?'<div class="tip">'+f[3]+'</div>':"")+'<h2 style="font-size:20px;color:var(--ink)">Did this fix the problem?</h2><div class="options"><button class="btn yes" onclick="solved()">Yes — Zoom works now ✓</button><button class="btn" onclick="notfixed()">No — keep troubleshooting</button></div></div>'}
function solved(){document.getElementById("screen").innerHTML='<div class="result" style="text-align:center"><div style="font-size:64px">🎉</div><h2>You’re back in business!</h2><p class="sub">Zoom is working. You can close this page and join your call.</p></div>'}
function notfixed(){hist.push(current);depth++;document.getElementById("screen").innerHTML='<div class="kicker">One more step</div><h2>Let’s keep going.</h2><div class="steps"><ol><li>Close Zoom completely.</li><li>Restart the Samsung phone.</li><li>Update Zoom Workplace in Google Play.</li><li>Open Zoom directly and join with the Meeting ID.</li><li>If it fails again, take a screenshot of the message.</li></ol></div><div class="tip warn"><b>Still stuck?</b> Send the screenshot plus what happened to the person helping you.</div>'}
function goBack(){if(!hist.length)return;let p=hist.pop();depth=Math.max(1,depth-2);render(p)}function start(){hist=[];depth=0;render("start")}start();
</script></body></html>
