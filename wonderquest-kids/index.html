<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WonderQuest Kids</title>
<style>
:root{--purple:#7C5CFF;--yellow:#FFD84D;--blue:#5EC8FF;--pink:#FF7A8A;--green:#62D26F;--white:#FFFBF2;--navy:#24304F}*{box-sizing:border-box}body{margin:0;font-family:"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif;background:linear-gradient(135deg,var(--blue),#d8f7ff);color:var(--navy)}button{font-family:inherit;cursor:pointer}.app{min-height:100vh;padding:18px;display:flex;justify-content:center;align-items:center}.screen{width:min(960px,100%);min-height:680px;background:var(--white);border-radius:34px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.18);position:relative;overflow:hidden}.screen:before{content:"";position:absolute;inset:-80px;background:radial-gradient(circle at 15% 20%,rgba(255,216,77,.35),transparent 20%),radial-gradient(circle at 88% 16%,rgba(255,122,138,.22),transparent 18%),radial-gradient(circle at 70% 90%,rgba(98,210,111,.24),transparent 22%);pointer-events:none}.content{position:relative;z-index:2}h1{font-size:clamp(38px,6vw,68px);margin:10px 0;text-align:center}h2{font-size:clamp(26px,4vw,40px);margin:8px 0 16px}p{font-size:20px;line-height:1.35}.subtitle{text-align:center;font-size:22px;margin-top:0}.card{background:white;border-radius:28px;padding:22px;box-shadow:0 10px 28px rgba(36,48,79,.14);margin:14px 0}.row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}.btn{border:0;border-radius:999px;padding:18px 26px;font-size:21px;font-weight:900;background:var(--purple);color:white;box-shadow:0 8px 0 rgba(36,48,79,.2);transition:transform .12s ease,box-shadow .12s ease;min-width:180px}.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(36,48,79,.2)}.btn.yellow{background:var(--yellow);color:var(--navy)}.btn.pink{background:var(--pink)}.btn.green{background:var(--green);color:var(--navy)}.btn.blue{background:var(--blue);color:var(--navy)}.btn.small{min-width:auto;font-size:16px;padding:10px 16px}.badge{display:inline-flex;align-items:center;gap:8px;background:var(--yellow);color:var(--navy);border-radius:999px;padding:12px 18px;font-weight:900;font-size:18px;box-shadow:0 8px 18px rgba(0,0,0,.12)}.character{width:125px;height:125px;border-radius:50%;margin:0 auto 14px;background:linear-gradient(135deg,var(--purple),var(--pink));display:flex;justify-content:center;align-items:center;font-size:64px;animation:float 2.4s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}.bubble{width:126px;height:126px;border-radius:50%;border:none;background:radial-gradient(circle at 30% 25%,white,var(--blue) 35%,var(--purple));color:white;font-size:44px;font-weight:900;box-shadow:0 12px 26px rgba(0,0,0,.18)}.letter{width:110px;height:110px;border-radius:24px;border:4px solid var(--navy);background:var(--yellow);font-size:48px;font-weight:900;color:var(--navy)}.word{display:inline-block;background:white;border:5px solid var(--purple);border-radius:26px;padding:20px 32px;font-size:62px;letter-spacing:10px;font-weight:900}.tile{min-height:145px;border-radius:30px;border:none;font-size:24px;font-weight:900;color:white;padding:18px;box-shadow:0 10px 24px rgba(0,0,0,.14)}.tile span{display:block;font-size:48px;margin-bottom:8px}.progress{height:20px;border-radius:999px;background:#e8e8ef;overflow:hidden}.progress div{height:100%;background:var(--green)}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}input{font-size:24px;padding:14px;border-radius:18px;border:3px solid #ddd;width:100%}.cert{border:8px double var(--purple);background:linear-gradient(135deg,#fff,#fff7c7);text-align:center}.confetti{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,var(--yellow) 0 5px,transparent 6px),radial-gradient(circle,var(--pink) 0 4px,transparent 5px),radial-gradient(circle,var(--green) 0 5px,transparent 6px),radial-gradient(circle,var(--blue) 0 4px,transparent 5px);background-size:80px 80px,92px 92px,110px 110px,130px 130px;animation:confetti 1.4s linear;opacity:0}@keyframes confetti{0%{opacity:1;transform:translateY(-40px)}100%{opacity:0;transform:translateY(160px)}}@media(max-width:600px){.screen{border-radius:0;min-height:100vh}.app{padding:0}.bubble,.letter{width:92px;height:92px;font-size:36px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const KEY='wonderquest_kids_state_v2';
const fresh={active:'Emma',profiles:{Emma:{stars:0,coins:0,math:0,read:0,completed:[],certs:[],avatar:{outfit:'Explorer',pet:'Fox Cub'},daily:{date:'',done:[]}}},settings:{narration:true,highContrast:false,largeText:false},pin:null};
let state=load(),score=0,round=1,total=5,math=null,letter=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(fresh)}catch{return structuredClone(fresh)}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function p(){return state.profiles[state.active]}function render(html){document.getElementById('root').innerHTML=`<div class="app"><main class="screen"><div class="content">${html}</div><div id="confetti" class="confetti"></div></main></div>`;apply()}function say(t){if(!state.settings.narration||!speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.88;speechSynthesis.speak(u)}function pop(){let c=document.getElementById('confetti');if(c){c.style.animation='none';c.offsetHeight;c.style.animation='confetti 1.4s linear'}}function badge(label,icon,n){return `<span class="badge">${icon} ${n} ${label}</span>`}function top(title=''){let x=p();return `<div class="top"><button class="btn small blue" onclick="home()">🏠 Home</button><strong>${title}</strong><div class="row">${badge('Stars','⭐',x.stars)} ${badge('Coins','🪙',x.coins)}</div></div>`}
function home(){let x=p();render(`<div class="character">🦊</div><h1>WonderQuest Kids</h1><p class="subtitle">Where little minds go on big adventures</p><div class="card"><p><strong>Nova says:</strong> Welcome back, ${state.active}! Ready to make WonderWorld shine?</p></div><div class="row"><button class="btn" onclick="map()">▶ Play</button><button class="btn pink" onclick="profiles()">👤 Profiles</button><button class="btn yellow" onclick="achievements()">🏆 Badges</button><button class="btn green" onclick="customize()">🎨 Customize</button><button class="btn blue" onclick="store()">🛍 Store</button><button class="btn pink" onclick="daily()">🚩 Daily</button><button class="btn" onclick="parentLock()">🔒 Parent</button><button class="btn blue" onclick="settings()">⚙ Settings</button></div><div class="row" style="margin-top:20px">${badge('Stars','⭐',x.stars)} ${badge('Coins','🪙',x.coins)}</div>`);say(`Welcome back, ${state.active}. Ready to make WonderWorld shine?`)}
function profiles(){let cards=Object.keys(state.profiles).map(n=>`<div class="card"><h2>${n}</h2><p>⭐ ${state.profiles[n].stars} Stars<br>🪙 ${state.profiles[n].coins} Coins</p><button class="btn green" onclick="choose('${n}')">Choose</button><button class="btn small blue" onclick="rename('${n}')">Rename</button></div>`).join('');render(`${top('Choose Explorer')}<div class="grid">${cards}<div class="card"><h2>Add Explorer</h2><input id="newName" placeholder="Child name"><br><br><button class="btn" onclick="addProfile()">Add</button></div></div>`)}function addProfile(){let n=document.getElementById('newName').value.trim()||'New Explorer';if(!state.profiles[n])state.profiles[n]=structuredClone(fresh.profiles.Emma);state.active=n;save();home()}function choose(n){state.active=n;save();home()}function rename(old){let n=prompt('New explorer name:',old);if(!n||n===old)return;state.profiles[n]=state.profiles[old];delete state.profiles[old];state.active=n;save();profiles()}
function map(){render(`${top('WonderWorld Map')}<h2>Choose a Learning World</h2><div class="grid"><button class="tile" style="background:var(--green)" onclick="startMath()"><span>🔢</span>Number Valley</button><button class="tile" style="background:var(--blue)" onclick="startLetters()"><span>🔤</span>Letter Lagoon</button><button class="tile" style="background:var(--purple)" onclick="alert('Shape Castle is coming next.')"><span>△</span>Shape Castle</button><button class="tile" style="background:var(--pink)" onclick="achievements()"><span>🏆</span>Reward Village</button></div>`)}
function startMath(){score=0;round=1;nextMath()}function nextMath(){let max=Math.min(5+Math.floor(p().math/10),20),a=Math.floor(Math.random()*max)+1,b=Math.floor(Math.random()*max)+1,ans=a+b,s=new Set([ans]);while(s.size<3){let w=ans+Math.floor(Math.random()*7)-3;if(w>0)s.add(w)}math={a,b,ans,choices:[...s].sort(()=>Math.random()-.5)};showMath()}function showMath(msg='Pop the bubble with the right answer!'){render(`${top('Bubble Pop Addition')}<div class="card"><p><strong>Nova:</strong> ${msg}</p></div><h1>${math.a} + ${math.b} = ?</h1><p class="subtitle">Round ${round}/${total} • Score ${score}</p><div class="row">${math.choices.map(x=>`<button class="bubble" onclick="answerMath(${x})">${x}</button>`).join('')}</div><br><div class="row"><button class="btn pink" onclick="map()">🗺 Map</button></div>`);say(msg)}function answerMath(x){if(x===math.ans){score++;pop();if(round>=total)return complete('Bubble Pop Addition','bubble','math');round++;showMath('Fantastic! You popped the right bubble!');setTimeout(nextMath,650)}else showMath('Nice try! Count carefully and try again.')}
const words=['CAT','DOG','SUN','HAT','BUG','MAP','FOX','BED','PEN','CUP','FISH','MOON'];function startLetters(){score=0;round=1;nextLetter()}function nextLetter(){let word=words[Math.floor(Math.random()*words.length)],i=Math.floor(Math.random()*word.length),target=word[i],s=new Set([target]);while(s.size<4)s.add(String.fromCharCode(65+Math.floor(Math.random()*26)));letter={word,i,target,choices:[...s].sort(()=>Math.random()-.5)};showLetters()}function showLetters(msg='Find the missing treasure letter!'){let h=letter.word.slice(0,letter.i)+'_'+letter.word.slice(letter.i+1);render(`${top('Letter Treasure Hunt')}<div class="card"><p><strong>Captain Splash:</strong> ${msg}</p></div><div style="text-align:center"><div class="word">${h}</div><p class="subtitle">Word: ${letter.word}</p><p>Round ${round}/${total} • Score ${score}</p></div><div class="row">${letter.choices.map(x=>`<button class="letter" onclick="answerLetter('${x}')">${x}</button>`).join('')}</div><br><div class="row"><button class="btn pink" onclick="map()">🗺 Map</button></div>`);say(msg)}function answerLetter(x){if(x===letter.target){score++;pop();if(round>=total)return complete('Letter Treasure Hunt','letters','reading');round++;showLetters('Amazing! You found the treasure letter!');setTimeout(nextLetter,650)}else showLetters('Good try! Look at the word and try again.')}
function complete(title,id,type){let x=p();x.stars+=5;x.coins+=20;if(!x.completed.includes(id))x.completed.push(id);if(type==='math')x.math=Math.min(100,x.math+10);if(type==='reading')x.read=Math.min(100,x.read+10);if(score>=4&&!x.certs.find(c=>c.id===id))x.certs.push({id,title:(type==='math'?'Math':'Reading')+' Champion',game:title,date:new Date().toLocaleDateString()});markDaily(type==='math'?'daily_math':'daily_letters');save();render(`${top('Adventure Complete')}<div style="text-align:center"><div class="character">🏆</div><h1>${score===total?'Perfect Adventure!':'Great Work!'}</h1><h2>${title}</h2><div class="card"><p><strong>Score:</strong> ${score}/${total}</p><div class="row">${badge('Stars','⭐',5)} ${badge('Coins','🪙',20)}</div></div><div class="row"><button class="btn" onclick="${id==='bubble'?'startMath()':'startLetters()'}">🔁 Play Again</button><button class="btn pink" onclick="map()">🗺 Map</button></div></div>`);say('Great work. You earned stars and coins.');pop()}
function achievements(){markDaily('daily_badges');save();let x=p(),b=[['Addition Champion','➕',x.completed.includes('bubble')],['Letter Explorer','🔤',x.completed.includes('letters')],['Star Collector','⭐',x.stars>=25],['Coin Saver','🪙',x.coins>=100],['Math Explorer','🧮',x.math>=25],['Reading Explorer','📚',x.read>=25]];render(`${top('Badge Wall')}<div class="grid">${b.map(y=>`<div class="card" style="text-align:center;opacity:${y[2]?1:.5}"><div style="font-size:54px">${y[2]?y[1]:'🔒'}</div><h2>${y[0]}</h2><p>${y[2]?'Earned!':'Keep exploring!'}</p></div>`).join('')}</div><h2>Certificates</h2>${x.certs.length?x.certs.map(c=>`<div class="card cert"><h2>Certificate of Achievement</h2><h1>${state.active}</h1><p>${c.title}</p><p>Completed ${c.game}</p><p>${c.date}</p></div>`).join(''):'<div class="card"><p>No certificates yet. Score 4 or better in a game to earn one.</p></div>'}`)}
function customize(){let x=p(),pets=['Fox Cub','Owl Chick','Baby Dragon','Puppy','Kitten'],out=['Explorer','Wizard','Astronaut','Pirate','Superhero'];render(`${top('Customize Explorer')}<div class="card" style="text-align:center"><div class="character">${x.avatar.pet.includes('Dragon')?'🐉':x.avatar.pet.includes('Owl')?'🦉':'🦊'}</div><h2>${x.avatar.outfit} Outfit</h2><p>Pet: ${x.avatar.pet}</p></div><h2>Outfit</h2><div class="row">${out.map(o=>`<button class="btn small green" onclick="setAvatar('outfit','${o}')">${o}</button>`).join('')}</div><h2>Pet</h2><div class="row">${pets.map(v=>`<button class="btn small pink" onclick="setAvatar('pet','${v}')">${v}</button>`).join('')}</div>`)}function setAvatar(k,v){p().avatar[k]=v;save();customize()}
function store(){render(`${top('Wonder Store')}<div class="card"><p><strong>Nova:</strong> Spend coins on fun rewards. No real money. Learning powers the store!</p></div><div class="grid">${['Wizard Outfit','Astronaut Outfit','Baby Dragon','Puppy','Rainbow Trail','Castle Room'].map((item,i)=>`<div class="card" style="text-align:center"><div style="font-size:54px">${['🧙','🚀','🐉','🐶','🌈','🏰'][i]}</div><h2>${item}</h2><p>${50+i*25} coins</p><button class="btn small" onclick="buy(${50+i*25},'${item}')">Unlock</button></div>`).join('')}</div>`)}function buy(cost,item){if(p().coins<cost)return alert('Not enough coins yet. Keep learning!');p().coins-=cost;save();alert(item+' unlocked!');store()}
function today(){let d=new Date();return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`}function ensureDaily(){if(p().daily.date!==today())p().daily={date:today(),done:[]}}function markDaily(id){ensureDaily();if(!p().daily.done.includes(id)){p().daily.done.push(id);p().stars+=1;p().coins+=5}}function daily(){ensureDaily();let x=p(),c=[['daily_math','Math Explorer','Play Bubble Pop Addition','startMath()'],['daily_letters','Letter Hunter','Play Letter Treasure Hunt','startLetters()'],['daily_badges','Badge Check','Visit your Badge Wall','achievements()']];render(`${top('Daily Challenges')}${c.map(y=>`<div class="card"><h2>${x.daily.done.includes(y[0])?'✅':'🚩'} ${y[1]}</h2><p>${y[2]}</p><button class="btn small ${x.daily.done.includes(y[0])?'green':''}" onclick="${y[3]}">${x.daily.done.includes(y[0])?'Done':'Go'}</button></div>`).join('')}`)}
function settings(){let s=state.settings;render(`${top('Settings')}${toggle('Narration','narration',s.narration)}${toggle('High Contrast','highContrast',s.highContrast)}${toggle('Large Text','largeText',s.largeText)}`)}function toggle(label,key,val){return `<div class="card"><h2>${label}</h2><button class="btn small ${val?'green':'pink'}" onclick="flip('${key}')">${val?'On':'Off'}</button></div>`}function flip(k){state.settings[k]=!state.settings[k];save();settings()}function apply(){document.body.style.filter=state.settings.highContrast?'contrast(1.2)':'';document.body.style.fontSize=state.settings.largeText?'115%':''}
function parentLock(){if(!state.pin){render(`${top('Create Parent PIN')}<div class="card"><h2>Create Parent PIN</h2><input id="pin1" maxlength="4" placeholder="4-digit PIN" type="password"><br><br><input id="pin2" maxlength="4" placeholder="Confirm PIN" type="password"><br><br><button class="btn" onclick="savePin()">Save PIN</button></div>`)}else{render(`${top('Parent Lock')}<div class="card"><h2>Parent Zone</h2><input id="pin" maxlength="4" placeholder="PIN" type="password"><br><br><button class="btn" onclick="unlockParent()">Unlock</button></div>`)}}function savePin(){let a=document.getElementById('pin1').value,b=document.getElementById('pin2').value;if(a.length!==4||a!==b)return alert('Please enter matching 4-digit PINs.');state.pin=a;save();parentDash()}function unlockParent(){if(document.getElementById('pin').value!==state.pin)return alert('That PIN did not work.');parentDash()}function parentDash(){let x=p();render(`${top('WonderParent Dashboard')}<div class="card"><h2>Child: ${state.active}</h2><p>Stars: ${x.stars}<br>Coins: ${x.coins}</p><p>Math Progress</p><div class="progress"><div style="width:${x.math}%"></div></div><p>Reading Progress</p><div class="progress"><div style="width:${x.read}%"></div></div></div><div class="row"><button class="btn green" onclick="achievements()">Certificates</button><button class="btn blue" onclick="alert('Screen time controls are enabled in the production build.')">Screen Time</button><button class="btn pink" onclick="resetDemo()">Reset Demo</button><button class="btn" onclick="state.pin=null;save();parentLock()">Reset PIN</button></div>`)}function resetDemo(){if(!confirm('Reset all demo data?'))return;state=structuredClone(fresh);save();home()}
home();
</script>
</body>
</html>
